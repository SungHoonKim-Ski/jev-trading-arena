name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: API 주소 주입 (저장소 변수 API_BASE_URL = Vercel 배포 주소)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          printf "window.JEV_API_BASE = '%s';\n" "${API_BASE_URL}" > public/config.js
          cat public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
