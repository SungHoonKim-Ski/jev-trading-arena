<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jev 트레이딩 아레나</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Jev 트레이딩 아레나</h1>
      <div class="sub">TypeSafe Jev 판단으로 한국·미국 주식과 코인을 모의 매매하고 전략별 수익률을 겨룹니다 · <span id="engine-badge"></span></div>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <a href="#run" data-tab="run">백테스트 실행</a>
      <a href="#rank" data-tab="rank">랭킹</a>
      <a href="#stats" data-tab="stats">전략 분석</a>
      <a href="#mine" data-tab="mine">내 기록</a>
      <a href="#data" data-tab="data">데이터</a>
    </nav>
  </header>
  <main>
    <section class="view" id="view-run"></section>
    <section class="view" id="view-rank"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-mine"></section>
    <section class="view" id="view-data"></section>
    <section class="view" id="view-detail"></section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
